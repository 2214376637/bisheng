map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream bisheng_backend {
        zone bisheng_backend 64k;
        server backend:7860 resolve;
}

upstream bisheng_minio {
        zone bisheng_minio 64k;
        server minio:9000 resolve;
}

server {
        gzip on;
        gzip_comp_level  2;
        gzip_min_length  1000;
        gzip_types  text/xml text/css;
        gzip_http_version 1.1;
        gzip_vary  on;
        gzip_disable "MSIE [4-6] \.";

        listen 3001;

        location / {
                root /usr/share/nginx/html/platform;
                index index.html index.htm;
                location = /index.html {
                        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
                        add_header Pragma "no-cache" always;
                        add_header Expires 0 always;
                }
                try_files $uri $uri/ /index.html;
                add_header X-Frame-Options SAMEORIGIN;
        }

        # 静态资源：缺失时返回 404
        location ^~ /workspace/assets/ {
                alias /usr/share/nginx/html/client/assets/;
                try_files $uri =404;
                expires 1y;
                add_header Cache-Control "public, immutable" always;
        }

        location = /workspace/registerSW.js {
                alias /usr/share/nginx/html/client/registerSW.js;
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        location = /workspace/sw.js {
                alias /usr/share/nginx/html/client/sw.js;
                add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # client SPA
        location /workspace/ {
                alias /usr/share/nginx/html/client/;
                index index.html index.htm;
                try_files $uri $uri/ @workspace_spa;
        }

        location = /workspace/index.html {
                alias /usr/share/nginx/html/client/index.html;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
                add_header Pragma "no-cache" always;
                add_header Expires 0 always;
        }

        location @workspace_spa {
                rewrite ^ /workspace/index.html last;
        }

        location ^~ /api/v1/all {
                default_type application/json;
                return 200 '{"status_code": 200, "status_message": "OK", "data": {}}';
        }

        location ^~ /workspace/api/v1/all {
                default_type application/json;
                return 200 '{"status_code": 200, "status_message": "OK", "data": {}}';
        }

        # API 代理：用 upstream + 带 URI 的 proxy_pass，/workspace/api/v1/env → backend/api/v1/env
        location ^~ /workspace/api/ {
                proxy_pass http://bisheng_backend/api/;
                proxy_read_timeout 300s;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                client_max_body_size 200m;
                add_header Access-Control-Allow-Origin $host;
                add_header X-Frame-Options SAMEORIGIN;
        }

        location ^~ /api/ {
                proxy_pass http://bisheng_backend/api/;
                proxy_read_timeout 300s;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                client_max_body_size 200m;
                add_header Access-Control-Allow-Origin $host;
                add_header X-Frame-Options SAMEORIGIN;
        }

        location ^~ /workspace/bisheng/ {
                proxy_pass http://bisheng_minio/bisheng/;
        }

        location ^~ /workspace/tmp-dir/ {
                proxy_pass http://bisheng_minio/tmp-dir/;
        }

        location ^~ /bisheng/ {
                proxy_pass http://bisheng_minio/bisheng/;
        }

        location ^~ /tmp-dir/ {
                proxy_pass http://bisheng_minio/tmp-dir/;
        }
}
